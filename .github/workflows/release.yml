name: Release

# Tags come from `just bump <kind>`, pushed with git push --follow-tags.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Official CPython for uv to build with: Nuitka segfaulted with uv's own
      # python-build-standalone. MSVC is preinstalled on windows-latest.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2

      # Nuitka's C compiler cache: unchanged modules are not recompiled. Older
      # entries still help when dependencies change, hence the restore key.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock', 'justfile') }}
          restore-keys: nuitka-${{ runner.os }}-

      - run: just build
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache

      - run: just package "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

      # WiX builds the MSI; its OSMF EULA asks for no fee under US$10,000 a year.
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 7.0.0
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - run: just msi

      - uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*
          generate_release_notes: true
          body: |
            Install with the MSI below (no admin rights needed), or with Scoop:

            ```powershell
            scoop install https://github.com/${{ github.repository }}/releases/latest/download/wallnext.json
            ```
