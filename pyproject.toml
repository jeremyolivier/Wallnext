[build-system]
requires = ["uv_build>=0.7,<0.8"]
build-backend = "uv_build"

[project]
name = "wallnext"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.13.1",
    "pydantic>=2.13.4",
    "pyside6-essentials>=6.11.2",
    "pywin32>=312",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.26.7",
]

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "ruff>=0.15.17",
    "ty>=0.0.48",
    "types-pywin32>=312.0.0.20260928",
]

[project.scripts]
wallnext = "wallnext.main:main"


